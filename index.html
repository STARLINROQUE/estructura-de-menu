<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Altura - Reservación de Vuelos</title>
    <link rel="stylesheet" href="styles.css">
    </head>
<body>

    <header>
        <div class="logo">
            <h1>CÓDIGO DE ALTURA</h1>
            <p>SOLUCIÓN AL MÁS ALTO NIVEL</p>
        </div>
        <nav>
            <a href="#" class="nav-link">Mis Reservaciones</a>
            <a href="#" class="btn btn-secondary">Registrarse</a>
            <a href="#" class="btn btn-primary">Iniciar Sesión</a>
        </nav>
    </header>

    <main class="hero-section">
        <h2>Busca tu Vuelo</h2>
        <p>Consulta información de vuelos y realiza reservaciones en línea.</p>

        <form class="search-form">
            <div class="input-group">
                <label for="destino">Destino:</label>
                <input type="text" id="destino" placeholder="Ciudad o país" required>
            </div>
            
            <div class="input-group">
                <label for="fecha">Fecha de Partida:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="input-group">
                <label for="hora">Hora de Partida:</label>
                <input type="time" id="hora">
            </div>

            <button type="submit" class="btn btn-search">Buscar Vuelo</button>
        </form>

        <div class="info-links">
            <a href="#">¿Necesitas cancelar un vuelo?</a>
            <a href="#">Programa de Millas Corporativo</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Código de Altura. Solución al más alto nivel.</p>
    </footer>

</body>
</html>
